dns:
  enable: false
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - time-macos.apple.com
    - '*.sandbox.google.com'
    - ntp.*.com
    - ntp1.*.com
    - '*.xboxlive.com'
    - '+.battlenet.com.cn'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - tls://8.8.4.4:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  route-address:
    - 0.0.0.0/1
    - 128.0.0.0/1
    - ::/1
    - 8000::/1
experimental:
  ignore-upload-bandwidth: true
  ignore-download-bandwidth: true
profile:
  store-selected: true
  store-fake-ip: true
  tracing: true
proxies: []
proxy-groups:
  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "{all_proxies}"
  - name: Proxy
    type: select
    proxies:
      - Auto
      - "{all_proxies}"
      - DIRECT
  - name: Fallback
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "{all_proxies}"
  - name: LoadBalance
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "{all_proxies}"
  - name: Direct
    type: select
    proxies:
      - DIRECT
      - Proxy
