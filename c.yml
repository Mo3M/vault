proxies: []
proxy-groups:
  - name: 🚀 Main 👆
    type: select
    proxies:
      - ♻️ Auto Fastest 2 ⚡
      - ♻️ Auto Fastest ⚡
      - ☑️ Manual Select 👆
      - DIRECT
      - REJECT
  - name: ♻️ Auto Fastest 2 ⚡
    type: select
    proxies:
      - "{all_proxies}"
  - name: ♻️ Auto Fastest ⚡
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "{all_proxies}"
  - name: ☑️ Manual Select 👆
    type: select
    proxies:
      - "{all_proxies}"
      - DIRECT
      - REJECT
  - name: 🎯 Global Direct
    type: select
    proxies:
      - DIRECT
      - 🚀 Main 👆
      - ♻️ Auto Fastest 2 ⚡
      - ♻️ Auto Fastest ⚡
      - ☑️ Manual Select 👆
  - name: 🛑 Global Block
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🚀 Main 👆
      - ☑️ Manual Select 👆
      - ♻️ Auto Fastest 2 ⚡
      - ♻️ Auto Fastest ⚡
      
  - name: 🐟 Free Fish
    type: select
    proxies:
      - 🚀 Main 👆
      - ☑️ Manual Select 👆
      - ♻️ Auto Fastest 2 ⚡
      - ♻️ Auto Fastest ⚡
      
      - DIRECT
      - REJECT
      
  - name: 📲 Telegram
